name: expenseflow
description: "ExpenseFlow — a modern personal finance & expense tracking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Auth (Firebase) — data storage is a separate Node.js + MongoDB backend,
  # see expenseflow-backend/
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0

  # Backend data API (Node.js + Express + MongoDB — see expenseflow-backend/)
  http: ^1.2.2

  # Local persistence (demo mode + settings cache)
  shared_preferences: ^2.2.3

  # Charts / formatting / utils
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  image_picker: ^1.1.2
  pdf: ^3.11.0
  printing: ^5.13.1
  csv: ^6.0.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.1
  collection: ^1.18.0

  # Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
