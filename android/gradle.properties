org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Works around a Kotlin incremental-compiler crash on Windows when the
# project and the Flutter pub cache live on different drive letters
# ("this and base files have different roots"). Costs a bit of rebuild
# speed but avoids the daemon compilation failures.
kotlin.incremental=false
